<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#182230
}
header{
  background:#fff;
  padding:16px 5%;
  border-bottom:1px solid #e5eaf2;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{font-size:21px;font-weight:800}
.container{max-width:750px;margin:35px auto;padding:15px}
.card{
  background:white;
  border:1px solid #e5eaf2;
  border-radius:17px;
  padding:24px;
  box-shadow:0 5px 25px #18223008;
  position:relative;
}
h1{font-size:28px;margin:0 0 10px}
.subtitle{color:#718096;font-size:14px;line-height:1.6}
label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:20px 0 9px
}
input,textarea,select{
  width:100%;
  padding:14px;
  border:1px solid #dce3ed;
  border-radius:10px;
  background:#fbfcff;
  font-size:15px;
  outline:none
}
input:focus,textarea:focus,select:focus{
  border-color:#3867f4
}
textarea{height:190px;resize:vertical;line-height:1.7}
button{
  border:0;
  border-radius:10px;
  padding:14px 17px;
  font-size:14px;
  font-weight:700;
  cursor:pointer
}
.primary{
  width:100%;
  margin-top:22px;
  background:#3867f4;
  color:white
}
.secondary{
  background:#eef3ff;
  color:#3867f4
}
.download{
  display:block;
  width:100%;
  margin-top:15px;
  padding:16px;
  background:#16834a;
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:10px;
  font-weight:700
}
.upload{
  border:2px dashed #cbd7ef;
  border-radius:13px;
  padding:25px 15px;
  text-align:center;
  background:#f9fbff
}
.upload p{color:#718096;font-size:13px;line-height:1.6}
.tabs{display:flex;gap:10px;margin:22px 0}
.tabs button{flex:1;background:#f0f3f8;color:#475467}
.tabs button.active{background:#3867f4;color:white}
.row-group{display:flex;gap:15px}
.row-group > div{flex:1}
#status{font-size:13px;line-height:1.6;margin-top:15px;color:#718096}
#status.error{color:#d63838}
#status.success{color:#16834a}
.hidden{display:none!important}
.file-list{font-size:13px;margin-top:10px}
.file-row{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #e5eaf2;border-radius:8px;margin-top:7px;overflow-wrap:anywhere}
.file-row button{padding:5px 8px;color:#d63838;background:#fff0f0}

/* Celebration Popup Modal Styles */
#celebrationModal {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeIn 0.3s ease;
}
.modal-content {
  background: white;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.big-check {
  width: 80px;
  height: 80px;
  background: #16834a;
  color: white;
  font-size: 50px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 15px;
  box-shadow: 0 5px 15px rgba(22, 131, 74, 0.4);
}
.modal-content h2 {
  color: #182230;
  margin: 0 0 8px;
  font-size: 22px;
}
.modal-content p {
  color: #718096;
  font-size: 14px;
  margin: 0;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes popUp {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

footer{text-align:center;color:#718096;font-size:12px;padding:25px}
@media(max-width:500px){
  .container{margin:18px auto;padding:12px}
  .card{padding:18px}
  h1{font-size:24px}
  .row-group{flex-direction:column;gap:0}
}
</style>
</head>

<body>
<header>
  <div class="logo">PDF Studio</div>
  <button class="secondary" id="topButton">Create PDF ↓</button>
</header>

<main class="container">
<section class="card" id="mainCard">

  <h1>Create your PDF</h1>
  <p class="subtitle">Choose your content, customize settings, and download your professional PDF.</p>

  <div class="tabs">
    <button class="active" data-mode="images">Images to PDF</button>
    <button data-mode="text">Text to PDF</button>
  </div>

  <label for="filename">PDF file name</label>
  <input id="filename" value="My Document" maxlength="100" placeholder="Enter PDF file name">

  <!-- Image Section -->
  <section id="imageSection">
    <label>Select images</label>
    <div class="upload">
      <p>Choose JPG, PNG or WEBP images from your device.</p>
      <button class="secondary" id="browseButton" type="button">Choose Images</button>
      <input type="file" id="images" accept="image/jpeg,image/png,image/webp" multiple hidden>
    </div>
    <div class="file-list" id="fileList"></div>
    
    <label for="pageSize">Page size</label>
    <select id="pageSize">
      <option value="fit">Fit image to page</option>
      <option value="a4">A4</option>
      <option value="letter">US Letter</option>
    </select>
  </section>

  <!-- Text Section -->
  <section id="textSection" class="hidden">
    <label for="heading">Document heading (optional)</label>
    <input id="heading" placeholder="Example: My School Notes">

    <div class="row-group">
      <div>
        <label for="textFont">Font Style</label>
        <select id="textFont">
          <option value="helvetica">Helvetica (Modern)</option>
          <option value="times">Times New Roman (Classic)</option>
          <option value="courier">Courier (Monospace)</option>
        </select>
      </div>
      <div>
        <label for="textSize">Font Size</label>
        <select id="textSize">
          <option value="10">Small (10pt)</option>
          <option value="12" selected>Normal (12pt)</option>
          <option value="14">Large (14pt)</option>
        </select>
      </div>
    </div>

    <label for="content">Write or paste your text</label>
    <textarea id="content" placeholder="Start writing or pasting your notes here..."></textarea>
  </section>

  <button class="primary" id="createButton">Create PDF</button>

  <div id="status" role="status" aria-live="polite">
    Choose your content to get started.
  </div>

  <a id="downloadButton" class="download hidden" download>
    ↓ Download PDF
  </a>

</section>
</main>

<footer>Your files are processed securely in your browser.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const $ = id => document.getElementById(id);

let mode = "images";
let selectedFiles = [];
let currentPdfUrl = null;

// High-volume, loud & powerful victory celebration chime sound using Web Audio API
function playLoudCelebrationSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Triumphant fanfare notes sequence (C5, G5, C6, E6) played with high volume
    const notes = [523.25, 783.99, 1046.50, 1318.51, 1567.98]; 
    
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = "triangle"; // Richer, louder sound wave
      osc.frequency.value = freq;
      
      // Louder volume and longer sustain for strong celebratory feel
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime + index * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.6);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(audioCtx.currentTime + index * 0.12);
      osc.stop(audioCtx.currentTime + index * 0.12 + 0.6);
    });
  } catch (e) {
    console.log("Audio error", e);
  }
}

// Show massive big checkmark celebration popup
function showCelebrationPopup() {
  const existing = $("celebrationModal");
  if(existing) existing.remove();

  const modal = document.createElement("div");
  modal.id = "celebrationModal";
  modal.innerHTML = `
    <div class="modal-content">
      <div class="big-check">✓</div>
      <h2>Congratulations!</h2>
      <p>Your PDF has been downloaded successfully! 🎉</p>
    </div>
  `;
  document.body.appendChild(modal);

  // Auto remove after 2.5 seconds
  setTimeout(() => {
    if(modal) modal.remove();
  }, 2500);
}

function status(message,type=""){
  $("status").textContent=message;
  $("status").className=type;
}

function clearDownload(){
  if(currentPdfUrl){
    URL.revokeObjectURL(currentPdfUrl);
    currentPdfUrl=null;
  }
  $("downloadButton").classList.add("hidden");
  $("downloadButton").removeAttribute("href");
}

document.querySelectorAll(".tabs button").forEach(button=>{
  button.addEventListener("click",()=>{
    mode=button.dataset.mode;

    document.querySelectorAll(".tabs button").forEach(b=>{
      b.classList.toggle("active",b===button);
    });

    $("imageSection").classList.toggle("hidden",mode!=="images");
    $("textSection").classList.toggle("hidden",mode!=="text");

    clearDownload();
    status("Ready to create your PDF.");
  });
});

$("topButton").addEventListener("click",()=>{
  $("mainCard").scrollIntoView({behavior:"smooth"});
});

$("browseButton").addEventListener("click",()=>$("images").click());

$("images").addEventListener("change",event=>{
  const allowed=["image/jpeg","image/png","image/webp"];
  const incoming=Array.from(event.target.files);
  const valid=incoming.filter(file=>allowed.includes(file.type));

  selectedFiles = valid; 
  renderFiles();
  clearDownload();

  status(valid.length+" image(s) added.",valid.length?"success":"error");
  event.target.value="";
});

function renderFiles(){
  const list=$("fileList");
  list.innerHTML="";

  selectedFiles.forEach((file,index)=>{
    const row=document.createElement("div");
    row.className="file-row";

    const name=document.createElement("span");
    name.textContent=file.name;

    const remove=document.createElement("button");
    remove.textContent="Remove";
    remove.type="button";
    remove.onclick=()=>{
      selectedFiles.splice(index,1);
      renderFiles();
      clearDownload();
      status("Image removed.");
    };

    row.append(name,remove);
    list.appendChild(row);
  });
}

function filename(){
  let name=$("filename").value.trim()||"My Document";
  name=name.replace(/\.pdf$/i,"").replace(/[\\/:*?"<>|]/g,"_");
  return (name||"My Document")+".pdf";
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>resolve({img,data:reader.result,file});
      img.onerror=()=>reject(new Error("Could not read "+file.name));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Could not open "+file.name));
    reader.readAsDataURL(file);
  });
}

async function imagesToPdf(){
  if(!selectedFiles.length)throw new Error("Please choose at least one image.");

  const {jsPDF}=window.jspdf;
  const size=$("pageSize").value;
  let pdf=null;

  for(let i=0;i<selectedFiles.length;i++){
    status("Preparing image "+(i+1)+" of "+selectedFiles.length+"...");

    const {img,data,file}=await readImage(selectedFiles[i]);
    const imgType = file.type==="image/png"?"PNG":"JPEG";

    if(size==="fit"){
      let w=img.width*25.4/96;
      let h=img.height*25.4/96;
      const max=270;
      const scale=Math.min(max/w,max/h,1);
      w*=scale;
      h*=scale;

      const orientation=w>h?"landscape":"portrait";

      if(!pdf){
        pdf=new jsPDF({orientation,unit:"mm",format:[w,h],compress:true});
      }else{
        pdf.addPage([w,h],orientation);
      }

      pdf.addImage(data,imgType,0,0,w,h,undefined,"FAST");
    }else{
      if(!pdf){
        pdf=new jsPDF({orientation:"portrait",unit:"mm",format:size,compress:true});
      }else{
        pdf.addPage(size,"portrait");
      }

      const pw=pdf.internal.pageSize.getWidth();
      const ph=pdf.internal.pageSize.getHeight();
      const margin=10;
      const scale=Math.min((pw-2*margin)/img.width,(ph-2*margin)/img.height);
      const w=img.width*scale;
      const h=img.height*scale;
      const x=(pw-w)/2;
      const y=(ph-h)/2;

      pdf.addImage(data,imgType,x,y,w,h,undefined,"FAST");
    }
  }

  return pdf;
}

function textToPdf(){
  const text=$("content").value.trim();
  const heading=$("heading").value.trim();
  const fontChoice=$("textFont").value;
  const baseFontSize=parseInt($("textSize").value, 10);

  if(!text)throw new Error("Please write or paste some text first.");

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  const margin=18;
  const pageWidth=pdf.internal.pageSize.getWidth();
  const pageHeight=pdf.internal.pageSize.getHeight();
  const width=pageWidth-margin*2;
  let y=margin;

  if(heading){
    pdf.setFont(fontChoice,"bold");
    pdf.setFontSize(baseFontSize + 6);
    const headingLines=pdf.splitTextToSize(heading,width);
    pdf.text(headingLines,margin,y);
    y+=headingLines.length*(baseFontSize*0.5)+8;
  }

  pdf.setFont(fontChoice,"normal");
  pdf.setFontSize(baseFontSize);
  
  const lineHeight = baseFontSize * 0.55;

  for(const paragraph of text.split(/\r?\n/)){
    const lines=paragraph.trim()?pdf.splitTextToSize(paragraph,width):[" "];

    for(const line of lines){
      if(y > pageHeight - margin - 10){
        pdf.addPage();
        y=margin;
      }
      pdf.text(line||" ",margin,y);
      y+=lineHeight;
    }
    y+=lineHeight*0.4;
  }

  const totalPages = pdf.internal.getNumberOfPages();
  for(let i = 1; i <= totalPages; i++){
    pdf.setPage(i);
    pdf.setFont(fontChoice, "normal");
    pdf.setFontSize(9);
    pdf.setTextColor(120, 120, 120);
    pdf.text(`Page ${i} of ${totalPages}`, pageWidth - margin, pageHeight - 10, { align: "right" });
  }

  return pdf;
}

// 1. Create PDF button only generates the green download button
$("createButton").addEventListener("click",async()=>{
  const button=$("createButton");
  button.disabled=true;
  button.textContent="Creating PDF...";
  clearDownload();

  try{
    if(!window.jspdf)throw new Error("PDF library could not load. Check your internet connection.");

    const pdf=mode==="images"?await imagesToPdf():textToPdf();
    
    currentPdfUrl = pdf.output("bloburl");
    const link=$("downloadButton");

    link.href=currentPdfUrl;
    link.download=filename();
    link.classList.remove("hidden");

    status("PDF is ready! Click the green button below to download.","success");
    link.scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(error){
    status(error.message||"Could not create PDF. Please try again.","error");
  }finally{
    button.disabled=false;
    button.textContent="Create PDF";
  }
});

// 2. Clicking Download button triggers big celebration popup, loud triumphant sound & download
$("downloadButton").addEventListener("click",()=>{
  playLoudCelebrationSound();
  showCelebrationPopup();
  status("✨ PDF downloaded successfully!","success");
});
</script>
</body>
  </html>
